name: 一傘亭

on:
  schedule:
    # 15分ごと。GitHubは毎時0分前後が混み、遅れたり取りこぼしたりするので、4分ずらしてある
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:          # 手動でも動かせる

permissions:
  contents: write

concurrency:
  group: issantei
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 呟くかどうか決めて、呟く
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSANTEI_MODEL: ${{ vars.ISSANTEI_MODEL }}
        run: python -m issantei.main

      - name: 結果を保存
        run: |
          git config user.name "issantei-bot"
          git config user.email "issantei-bot@users.noreply.github.com"
          git add docs/data state
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "一傘亭 $(TZ=Asia/Tokyo date +'%m/%d %H:%M')"
            git push
          fi
