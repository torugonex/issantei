name: 一傘亭

on:
  schedule:
    # 予備の定時実行。GitHub側でしばしば取りこぼされるので、主役は外部の時計（README参照）
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:          # 手動、または外部の時計（cron-job.org）から起こす
    inputs:
      force:
        description: "確率に関係なく必ず呟かせる（確認用）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: issantei
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 呟くかどうか決めて、呟く
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSANTEI_MODEL: ${{ vars.ISSANTEI_MODEL }}
          ISSANTEI_FORCE: ${{ inputs.force }}
        run: python -m issantei.main

      - name: 結果を保存
        run: |
          git config user.name "issantei-bot"
          git config user.email "issantei-bot@users.noreply.github.com"
          git add docs/data state
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "一傘亭 $(TZ=Asia/Tokyo date +'%m/%d %H:%M')"
            git push
          fi
